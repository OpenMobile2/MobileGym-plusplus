name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  imports:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Every relative import resolves to a committed file
        run: python3 scripts/check_imports.py .

  build:
    needs: imports
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: "1"
      - run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=6144
